[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.1.0"
description = "Multi-agent orchestration system that produces market research reports"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
mas = "mas.cli:main"
mas-worker = "mas.distributed.cli:main"
mas-eval = "mas.evals.cli:main"
mas-label = "mas.evals.label_cli:main"
mas-ablate = "mas.evals.ablate_cli:main"
mas-serve = "mas.web.cli:main"

[project.optional-dependencies]
# The suite runs fully offline, but needs pytest itself and httpx, which
# fastapi.testclient imports. Neither is a runtime dependency.
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: spawns real subprocesses"]
pythonpath = ["src"]
